
  name: CI

  on:
    pull_request:
      branches: [ "main" ]
    push:
      branches: [ "main" ]

  jobs:
    build-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "21"
            cache: maven

        - name: Build & test (all modules)
          run: mvn -q -DskipTests=false test package
